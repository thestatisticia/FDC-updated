<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>FDC Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.10.0/dist/ethers.umd.min.js"></script>
    <style>
        :root {
            color-scheme: light dark;
            font-family: system-ui, sans-serif;
        }
        body {
            margin: 0;
            padding: 2rem;
            background: #0f172a;
            color: #f8fafc;
        }
        .app {
            max-width: 720px;
            margin: 0 auto;
            background: rgba(15, 23, 42, 0.7);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 20px 45px rgba(15, 23, 42, 0.4);
        }
        h1 {
            margin-bottom: 1.5rem;
            font-size: 2rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 0.75rem;
            margin-bottom: 1rem;
            border-radius: 12px;
            border: 1px solid rgba(148, 163, 184, 0.3);
            background: rgba(15, 23, 42, 0.8);
            color: inherit;
        }
        button {
            padding: 0.75rem 1.25rem;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            margin-right: 1rem;
        }
        .primary {
            background: #38bdf8;
            color: #0f172a;
        }
        .secondary {
            background: rgba(148, 163, 184, 0.2);
            color: #f8fafc;
        }
        .logs {
            margin-top: 1.5rem;
            padding: 1rem;
            background: rgba(30, 41, 59, 0.8);
            border-radius: 12px;
            font-family: "Fira Code", monospace;
            font-size: 0.9rem;
            white-space: pre-wrap;
        }
        .cards {
            margin-top: 1.5rem;
            display: grid;
            gap: 1rem;
        }
        .card {
            padding: 1rem;
            background: rgba(30, 41, 59, 0.8);
            border-radius: 12px;
            display: grid;
            gap: 0.35rem;
        }
        .card span {
            opacity: 0.8;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
<div class="app">
    <h1>FDC Simple Viewer</h1>
    <p>Inspect attested Star Wars characters stored by <code>StarWarsCharacterListV2</code> or explore mock data without hitting the network.</p>

    <label for="rpc">RPC URL</label>
    <input id="rpc" placeholder="https://coston2-api.flare.network/ext/C/rpc" />

    <label for="address">Contract Address</label>
    <input id="address" placeholder="0x..." />

    <div>
        <button id="loadLive" class="primary">Load from network</button>
        <button id="loadMock" class="secondary">Use mock data</button>
    </div>

    <div class="logs" id="logs">Waiting for input…</div>
    <div class="cards" id="cards"></div>
</div>

<script>
    const mockData = [
        { name: "R2-D2", numberOfMovies: 6, apiUid: 3, bmi: 34 },
        { name: "Luke Skywalker", numberOfMovies: 5, apiUid: 1, bmi: 26 },
        { name: "Leia Organa", numberOfMovies: 5, apiUid: 5, bmi: 22 }
    ];

    const abi = [
        "function getAllCharacters() view returns (tuple(string name,uint256 numberOfMovies,uint256 apiUid,uint256 bmi)[])"
    ];

    const logs = document.getElementById("logs");
    const cards = document.getElementById("cards");

    function setStatus(message) {
        logs.textContent = message;
    }

    function renderCharacters(characters) {
        cards.innerHTML = "";
        characters.forEach(({ name, numberOfMovies, apiUid, bmi }) => {
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `
                <strong>${name}</strong>
                <span>ID: ${apiUid}</span>
                <span>Films: ${numberOfMovies}</span>
                <span>BMI: ${bmi}</span>
            `;
            cards.appendChild(card);
        });
        if (!characters.length) {
            setStatus("No characters stored yet — run the Web2Json script to add one.");
        } else {
            setStatus(`Loaded ${characters.length} characters.`);
        }
    }

    async function loadFromNetwork() {
        try {
            setStatus("Connecting to provider…");
            const rpc = document.getElementById("rpc").value.trim();
            const address = document.getElementById("address").value.trim();
            if (!rpc || !address) {
                setStatus("Please provide both RPC URL and contract address.");
                return;
            }

            const provider = new ethers.JsonRpcProvider(rpc);
            const contract = new ethers.Contract(address, abi, provider);
            setStatus("Fetching characters from chain…");
            const characters = await contract.getAllCharacters();
            const mapped = characters.map((item) => ({
                name: item.name,
                numberOfMovies: Number(item.numberOfMovies),
                apiUid: Number(item.apiUid),
                bmi: Number(item.bmi),
            }));
            renderCharacters(mapped);
        } catch (error) {
            console.error(error);
            setStatus(`Failed to load characters: ${error.message ?? error}`);
        }
    }

    function loadMock() {
        setStatus("Showing mock data (no network calls).");
        renderCharacters(mockData);
    }

    document.getElementById("loadLive").addEventListener("click", loadFromNetwork);
    document.getElementById("loadMock").addEventListener("click", loadMock);
    loadMock();
</script>
</body>
</html>
